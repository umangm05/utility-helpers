name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: Site (build + verify + known-answer tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          npm ci --no-audit --no-fund
          pip install playwright
          python3 -m playwright install --with-deps chromium
      - name: Astro build (site.config.json -> dist/)
        run: npm run build
      - name: Generated tool-slugs.mjs is committed and in sync
        run: git diff --exit-code netlify/lib/tool-slugs.mjs
      - name: Build invariants on dist/ (titles, h1, sitemap, consent wiring)
        run: python3 scripts/check_dist.py
      - name: Verify routes (fresh-context per-route assertions)
        run: python3 scripts/verify.py
      - name: Known-answer tool tests (10 developer tools)
        run: python3 scripts/test_tools.py
      - name: Known-answer file-tool tests (image, PDF, HEIC, QR, passport photo; no off-device requests)
        run: python3 scripts/test_file_tools.py
      - name: Known-answer + offline tests (typing test, money, dates, spin wheel, background remover; service worker; no off-device requests)
        run: python3 scripts/test_new_tools.py
      - name: Consent + usage-event contract (Reject sends nothing, no tool content)
        run: python3 scripts/test_consent.py
      - name: New UI (Ctrl+K, recents, drop zone, theme; no network)
        run: python3 scripts/test_ui.py
      - name: Netlify Functions unit tests
        run: npm test

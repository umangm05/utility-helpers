name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: Site (build + verify + known-answer tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          npm ci --no-audit --no-fund
          pip install playwright
          python3 -m playwright install --with-deps chromium
      - name: Astro build (site.config.json -> dist/)
        run: npm run build
      - name: Generated tool-slugs.mjs is committed and in sync
        run: git diff --exit-code netlify/lib/tool-slugs.mjs
      - name: Build invariants on dist/ (titles, h1, sitemap, consent wiring)
        run: python3 scripts/check_dist.py
      - name: Verify routes (fresh-context per-route assertions)
        run: python3 scripts/verify.py
      - name: Known-answer tool tests (10 developer tools)
        run: python3 scripts/test_tools.py
      - name: Known-answer file-tool tests (image, PDF, HEIC, QR, passport photo; no off-device requests)
        run: python3 scripts/test_file_tools.py
      - name: Known-answer + offline tests (typing test, money, dates, spin wheel, background remover; service worker; no off-device requests)
        run: python3 scripts/test_new_tools.py
      - name: Consent + usage-event contract (Reject sends nothing, no tool content)
        run: python3 scripts/test_consent.py
      - name: New UI (Ctrl+K, recents, drop zone, theme; no network)
        run: python3 scripts/test_ui.py
      - name: Netlify Functions unit tests
        run: npm test
      - name: Keep the verified build for the deploy job
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          include-hidden-files: true
          retention-days: 3

  # Every master push that passes the site job goes live on Cloudflare Pages
  # (https://utility-helpers.umangmittal.me, D-UTILITY-HELPERS-CLOUDFLARE-PAGES).
  # It deploys the exact dist/ the checks above verified; nothing is rebuilt.
  # Needs repo secrets CLOUDFLARE_API_TOKEN (Account > Cloudflare Pages: Edit)
  # and CLOUDFLARE_ACCOUNT_ID, plus repo variable CF_PAGES_PROJECT (the Pages
  # project name). Until they exist the job warns and skips instead of failing.
  deploy:
    name: Deploy to Cloudflare Pages
    needs: site
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    concurrency:
      group: cf-pages-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://utility-helpers.umangmittal.me
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
    steps:
      - name: Check Cloudflare credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CF_PAGES_PROJECT" ]; then
            echo "::warning::Cloudflare deploy skipped: set secrets CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and variable CF_PAGES_PROJECT."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.creds.outputs.ok == 'true'
        with:
          name: dist
          path: dist
      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ok == 'true'
        with:
          node-version: '24'
      # No --branch and no .git in dist/ -> wrangler targets the project's
      # production branch, whatever it is named in the dashboard.
      - name: wrangler pages deploy
        if: steps.creds.outputs.ok == 'true'
        run: >
          npx --yes wrangler@4 pages deploy dist
          --project-name="$CF_PAGES_PROJECT"
          --commit-dirty=true
          --commit-hash="$GITHUB_SHA"
          --commit-message="${GITHUB_SHA::7} via GitHub Actions run $GITHUB_RUN_ID"

# Netlify configuration for Utility Helpers.
#
# The site is built by Astro (MIT) from site.config.json into dist/: one
# pre-rendered HTML page per tool at the same /<slug>/ URL as before.
# Netlify Functions (netlify/functions: /api/e usage events, /api/suggest)
# are picked up from the default functions directory, unchanged.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Astro's hashed bundles never change content under the same name.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Unhashed static assets (site.js, og.png, favicon.svg).
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Service worker: always revalidate so a new build's worker is picked up promptly.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "public, max-age=86400"

# Background-remover model (U2-Net u2netp, Apache-2.0). The name is versioned by
# content: rename the file if the model ever changes.
[[headers]]
  for = "/models/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# UI sounds (uisfx, CC0).
[[headers]]
  for = "/sfx/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Security headers (safe defaults for a static, no-backend site).
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # camera=(self): the QR scanner (/qr-code-generator/) reads frames locally; no other origin may ask.
    Permissions-Policy = "geolocation=(), microphone=(), camera=(self)"

# Serve the custom 404 page for unknown paths.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

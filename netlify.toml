# Netlify configuration for Utility Helpers.
#
# The site is built by Astro (MIT) from site.config.json into dist/: one
# pre-rendered HTML page per tool at the same /<slug>/ URL as before.
# Netlify Functions (netlify/functions: /api/e usage events, /api/suggest)
# are picked up from the default functions directory, unchanged.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Astro's hashed bundles never change content under the same name.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Unhashed static assets (site.js, og.png, favicon.svg).
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Security headers (safe defaults for a static, no-backend site).
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Serve the custom 404 page for unknown paths.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
